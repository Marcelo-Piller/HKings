<!DOCTYPE html>
<html lang="pt-BR">
<head>
  {{template "brand_head" .}}
  <title>Administração — Livredo</title>
</head>
<body class="bg-musgo-950 font-sans text-cafe-800 min-h-screen flex items-center justify-center p-4 antialiased">
  <div class="bg-papel-50 rounded-3xl shadow-2xl p-9 w-full max-w-sm">
    <div class="text-center">
      <p class="font-serif text-lg text-musgo-700">Livre<em class="italic">do</em></p>
      <h1 class="font-serif text-3xl text-musgo-950 mt-1">Administração</h1>
      <div class="ornamento max-w-[8rem] mx-auto mt-4 text-sm" aria-hidden="true"><span>❦</span></div>
    </div>

    {{if .Error}}
    <div class="mt-6 rounded-xl bg-canela-50 border border-canela-200 px-4 py-3 text-sm text-canela-800">{{.Error}}</div>
    {{end}}

    <form action="/admin/login" method="post" class="mt-6 space-y-4">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}"/>
      <div>
        <label for="usuario" class="block text-sm text-cafe-600 mb-1.5">Usuário</label>
        <input id="usuario" type="text" name="usuario" required autofocus autocomplete="username"
               class="w-full bg-white border border-papel-300 rounded-xl px-4 py-3 focus:outline-none focus:border-musgo-500 transition"/>
      </div>
      <div>
        <label for="senha" class="block text-sm text-cafe-600 mb-1.5">Senha</label>
        <input id="senha" type="password" name="senha" required autocomplete="current-password"
               class="w-full bg-white border border-papel-300 rounded-xl px-4 py-3 focus:outline-none focus:border-musgo-500 transition"/>
      </div>
      <button type="submit" class="w-full bg-musgo-800 hover:bg-musgo-700 text-papel-50 py-3.5 rounded-full font-medium shadow-sm transition">
        Entrar
      </button>
    </form>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <title>Login Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config={theme:{extend:{colors:{shell:{500:'#e05575',600:'#c9405e'},forest:{700:'#1c4d3d',800:'#163829',900:'#0f2519'}}}}}
  </script>
</head>
<body class="bg-forest-900 min-h-screen flex items-center justify-center">
  <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-sm">
    <div class="text-center mb-6">
      <div class="text-4xl mb-2">🛍️</div>
      <h1 class="text-2xl font-bold text-forest-800">Painel Admin</h1>
      <p class="text-gray-500 text-sm mt-1">Entre com suas credenciais</p>
    </div>

    {{if .Error}}
    <div class="bg-red-50 border border-red-300 text-red-700 rounded-lg px-4 py-2.5 text-sm mb-4">{{.Error}}</div>
    {{end}}

    <form action="/admin/login" method="post" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Usuário</label>
        <input type="text" name="usuario" required autofocus
               class="w-full border border-gray-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-shell-400"
               placeholder="admin"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
        <input type="password" name="senha" required
               class="w-full border border-gray-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-shell-400"/>
      </div>
      <button type="submit"
              class="w-full bg-shell-500 text-white py-2.5 rounded-xl font-bold hover:bg-shell-600 transition shadow-md">
        Entrar
      </button>
    </form>
  </div>
</body>
</html>

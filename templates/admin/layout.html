{{define "admin_layout"}}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{block "admin_title" .}}Admin{{end}} - Painel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            shell:  { 50:'#fdf2f5',100:'#fce4ea',400:'#ec7592',500:'#e05575',600:'#c9405e',700:'#a8304a' },
            forest: { 200:'#a9d2bc',300:'#74b498',600:'#24624f',700:'#1c4d3d',800:'#163829',900:'#0f2519' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-stone-100 min-h-screen">

<div class="flex min-h-screen">
  <!-- Sidebar -->
  <aside class="w-56 bg-forest-900 text-forest-200 flex flex-col">
    <div class="p-5 text-white font-bold text-lg border-b border-forest-700">🛍️ Admin</div>
    <nav class="flex-1 p-3 space-y-1 text-sm">
      <a href="/admin" class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-forest-700 hover:text-white transition">📊 Dashboard</a>
      <a href="/admin/produtos" class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-forest-700 hover:text-white transition">📦 Produtos</a>
      <a href="/admin/pedidos" class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-forest-700 hover:text-white transition">🛒 Pedidos</a>
      <a href="/" class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-forest-700 hover:text-white transition" target="_blank">🌐 Ver Loja</a>
    </nav>
    <div class="p-3 border-t border-forest-700">
      <form action="/admin/logout" method="post">
        <button class="w-full text-left flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-forest-700 hover:text-white text-sm transition">🚪 Sair</button>
      </form>
    </div>
  </aside>

  <!-- Main -->
  <div class="flex-1 flex flex-col">
    <header class="bg-white shadow-sm px-6 py-4 border-b border-stone-200">
      <h1 class="text-xl font-semibold text-forest-700">{{block "admin_heading" .}}{{end}}</h1>
    </header>
    <main class="flex-1 p-6">
      {{block "admin_content" .}}{{end}}
    </main>
  </div>
</div>

</body>
</html>
{{end}}

<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600">
  <!-- Capa genérica de livro, usada quando o produto não tem foto -->
  <defs>
    <linearGradient id="capa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#256F47"/>
      <stop offset="1" stop-color="#1A4A31"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#capa)"/>
  <!-- Moldura dupla em ouro -->
  <rect x="28" y="28" width="344" height="544" fill="none" stroke="#B37F3A" stroke-width="2" opacity=".85"/>
  <rect x="40" y="40" width="320" height="520" fill="none" stroke="#B37F3A" stroke-width="1" opacity=".55"/>
  <!-- Cantoneiras -->
  <g fill="#CC9A52" opacity=".9">
    <path d="M40 40h26l-26 26z"/>
    <path d="M360 40h-26l26 26z"/>
    <path d="M40 560h26l-26-26z"/>
    <path d="M360 560h-26l26-26z"/>
  </g>
  <!-- Florão central: livro aberto com folha -->
  <g transform="translate(200 250)" fill="none" stroke="#EACFA3" stroke-width="4" stroke-linejoin="round">
    <path d="M-62 -28h36a18 18 0 0 1 18 18v62a13 13 0 0 0-13-13h-41z"/>
    <path d="M62 -28h-36a18 18 0 0 0-18 18v62a13 13 0 0 1 13-13h41z"/>
  </g>
  <path d="M200 236c0-16 9-27 25-30-2 16-11 25-25 30z" fill="#CC9A52"/>
  <!-- Filete e texto -->
  <line x1="130" y1="352" x2="270" y2="352" stroke="#B37F3A" stroke-width="1.5" opacity=".7"/>
  <text x="200" y="392" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic" fill="#F5E7D0" text-anchor="middle">Livredo</text>
  <text x="200" y="424" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="4" fill="#CC9A52" text-anchor="middle">CAPA EM BREVE</text>
</svg>
